<style>
  .app{display:flex;border-radius:8px;overflow:hidden;background:#1f2124;color:#d7dbe0;font-family:'Malgun Gothic',sans-serif;font-size:12px}
  .stage{flex:1;position:relative;min-width:0}
  .stage canvas{display:block;width:100%;height:100%}
  .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:7px 10px;background:linear-gradient(#2a2d31f0,#2a2d3100);pointer-events:none}
  .bar .phs{display:flex;gap:3px;flex-wrap:wrap}
  .bar .phs span{padding:2px 8px;border-radius:3px;font-size:11px;background:#363a40;color:#8a9099}
  .bar .phs span.done{background:#4c5158;color:#d7dbe0}.bar .phs span.on{background:#ff8a1f;color:#1b1d20;font-weight:700}
  .bar .clk{color:#9aa1aa;font-size:11px;white-space:nowrap;text-align:right}
  .bar .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .lgd{pointer-events:auto;background:#141619e8;border:1px solid #3a3e44;border-radius:6px;padding:5px 8px;font-size:10.5px;line-height:1.7;color:#c3c8cf;white-space:nowrap}
  .lgd summary{cursor:pointer;color:#f2c230;font-weight:700;font-size:11px;list-style:none}
  .lgd summary::-webkit-details-marker{display:none}
  .lgd .g{color:#8a9099;margin-top:3px}
  .lgd .it{display:flex;align-items:center;gap:6px}
  .lgd .sw{width:22px;flex:none;display:flex;justify-content:center;align-items:center}
  .lgd .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:-1px}
  .side{width:34%;min-width:360px;max-width:520px;overflow:auto;background:#26292d;border-left:1px solid #3a3e44;padding:10px}
  .sec{background:#1b1d20;border-radius:6px;padding:8px 10px;margin-bottom:8px;line-height:1.55}
  .sec h4{margin:0 0 5px;font-size:11px;color:#f2c230;font-weight:700;letter-spacing:.02em}
  .ctl{display:flex;gap:4px;align-items:center;margin-bottom:6px}
  .ctl select,.ctl button{font:inherit;font-size:12px;border:0;border-radius:4px;padding:3px 8px;background:#363a40;color:#d7dbe0;cursor:pointer}
  .ctl .n{margin-left:auto;color:#9aa1aa}
  .ttl{font-size:14px;font-weight:700;color:#fff}.who{color:#9aa1aa}
  .res{border-left:3px solid #46c46e}.res.ng{border-left-color:#ff5a5a;background:#2a1b1d}.res.run{border-left-color:#4c5158}
  .res .big{font-weight:700;font-size:13px}.res.ng .big{color:#ff8a8a}.res.ng.info{border-left-color:#ffd23f;background:#2a2617}.res.ng.info .big{color:#ffe08a}.res .big.ok{color:#7fe0a0}
  .row{display:flex;gap:6px;padding:1px 3px;border-radius:3px}.row i{font-style:normal;width:16px;flex:none;text-align:center}
  .row[data-lot]{cursor:pointer}.row[data-lot]:hover,.row.hl{background:#3a2a18}
  .mut{color:#6a7079}
  .pill{display:inline-block;padding:0 6px;border-radius:9px;font-size:10px;margin:1px 3px 1px 0;border:1px solid}
  .p-ok{color:#7fe0a0;border-color:#2f6b45}.p-as{color:#ffd79a;border-color:#7a5a20}.p-ng{color:#ff9a9a;border-color:#7a2f2f}.p-ck{color:#a8d4ff;border-color:#2a4560}
  table.inv{width:100%;border-collapse:collapse;font-size:11px}
  table.inv td{padding:2px 4px;border-bottom:1px solid #2c2f34}table.inv td:last-child{text-align:right;color:#ffd79a}
  table.inv tr.ch td{background:#3a2a18;color:#fff}table.inv tr.z td{color:#5a6068}
  .q{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
  details summary{cursor:pointer;color:#8a9099;font-size:11px}
  .card{border:1px solid #ff8a1f;border-radius:5px;padding:6px 8px;margin-bottom:6px;background:#211a12}
  .card b{color:#ff8a1f}
</style>

        <div class="it"><span class="sw"><svg width="20" height="6"><line x1="1" y1="3" x2="19" y2="3" stroke="#3fd0e0" stroke-width="1.6" stroke-dasharray="4 3"/></svg></span>청록 점선 = 계보 (부모 → 자식)</div>
        <div class="it"><span class="sw"><svg width="16" height="11"><rect x="1" y="1" width="14" height="9" fill="#4ea1ff" stroke="#1b1d20"/><path d="M1 1l7 5 7-5" stroke="#1b1d20" fill="none"/></svg></span>파란 봉투 = SAP → 미들웨어 → MES 서버 수신</div>
        <div class="it"><span class="sw"><svg width="16" height="11"><rect x="1" y="1" width="14" height="9" fill="#ff8a1f" stroke="#1b1d20"/><path d="M1 1l7 5 7-5" stroke="#1b1d20" fill="none"/></svg></span>주황 봉투 = MES 서버 → 미들웨어 → SAP 송신</div>
        <div class="it"><span class="sw"><svg width="20" height="6"><line x1="1" y1="3" x2="19" y2="3" stroke="#f2c230" stroke-width="1.4" stroke-dasharray="4 3"/></svg></span>노란 점선 = 통로</div>
        <div class="it"><span class="sw"><span class="dot" style="background:#4f78a8"></span></span>바닥: 파랑 창고 · 빨강 보류·폐기 · 노란 테두리 공정</div>
      </details></div></div></div>
  <div class="side" id="side"></div>
</div>

<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),side=document.getElementById('side'),app=document.getElementById('app');
var W,H,s,ox,oy;
function P(x,y,z){return [ox+(x-y)*0.866*s, oy+(x+y)*0.5*s-(z||0)*s];}
function fit(){
  var top=app.getBoundingClientRect().top+(window.scrollY||0),h=Math.max(480,window.innerHeight-Math.max(0,top-(window.scrollY||0))-12);
  app.style.height=h+'px';var w=stage.clientWidth,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;
  var xs=[],ys=[];[[-4,-0.5],[21.8,-0.5],[21.8,13],[-4,13]].forEach(function(c){[0,4].forEach(function(z){xs.push((c[0]-c[1])*0.866);ys.push((c[0]+c[1])*0.5-z);});});
  var mnx=Math.min.apply(0,xs),mxx=Math.max.apply(0,xs),mny=Math.min.apply(0,ys),mxy=Math.max.apply(0,ys),pt=40,pb=6,px=8;
  s=Math.min((W-2*px)/(mxx-mnx),(H-pt-pb)/(mxy-mny));
  ox=px+((W-2*px)-(mxx-mnx)*s)/2-mnx*s;oy=pt-mny*s;}
var K={floor:['#34383e','#26292d','#1f2124'],m:['#8a9099','#686e77','#545961'],m2:['#6f757e','#555b63','#43484f'],st:'#1b1d20',
  roll:['#e8d9b0','#f6ecd0'],rollD:['#bfb391','#cfc3a2'],box:['#c79a62','#a57a45','#8c6a40'],pal:['#9b7a4f','#7d6040','#664e33'],
  pad:['#ddd2b6','#bfb497','#a99f84'],fa:['#f4f1ea','#d9d4c8','#c4bfb3'],acc:'#ff8a1f',acc2:'#e06d0a',body:'#3d6fb0',hat:'#f2c230',skin:'#e7c3a0',
  truck:['#5d7fa8','#46658a','#384f6c'],panel:['#2b3a4a','#1d2a36','#16202a'],sap:['#2e4f78','#223c5c','#1a2f49']};

// ── 그리기 기본 ──
function path(pts){ctx.beginPath();for(var i=0;i<pts.length;i++){i?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1]);}ctx.closePath();}
function fillP(pts,f,st){path(pts);if(f){ctx.fillStyle=f;ctx.fill();}if(st){ctx.strokeStyle=st;ctx.lineWidth=0.8;ctx.stroke();}}
function poly3(p3,f,st){fillP(p3.map(function(q){return P(q[0],q[1],q[2]);}),f,st);}
function drawBox(x,y,z,w,d,h,c){
  poly3([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[1],K.st);
  poly3([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[2],K.st);
  poly3([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0],K.st);}
function hull(p){p=p.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
  function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var lo=[],up=[],i;for(i=0;i<p.length;i++){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p[i])<=0)lo.pop();lo.push(p[i]);}
  for(i=p.length-1;i>=0;i--){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p[i])<=0)up.pop();up.push(p[i]);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
function drawCyl(cx,cy,cz,r,len,axis,side,cap,spin){
  if(r<=0.01)return;var A=[],B=[];
  for(var i=0;i<24;i++){var t=i/24*Math.PI*2,c=r*Math.cos(t),sn=r*Math.sin(t);
    if(axis==='y'){A.push(P(cx+c,cy-len/2,cz+sn));B.push(P(cx+c,cy+len/2,cz+sn));}
    else {A.push(P(cx+c,cy+sn,cz));B.push(P(cx+c,cy+sn,cz+len));}}
  fillP(hull(A.concat(B)),side,K.st);fillP(B,cap,K.st);
  if(axis==='y'){var q0=P(cx,cy+len/2,cz),q1=P(cx+Math.cos(spin||0)*r*0.85,cy+len/2,cz+Math.sin(spin||0)*r*0.85);
    ctx.strokeStyle=K.acc2;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();}}
function lp(p,q,t){return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t];}
function stick(a,b,c,d){poly3([a,b,c,d],'#f6f5ef','#3a3e44');ctx.strokeStyle='#1b1d20';
  for(var k=0;k<16;k++){if((k*7)%5<2)continue;var t=0.1+0.8*k/15,u=lp(lp(a,b,t),lp(d,c,t),0.12),v=lp(lp(a,b,t),lp(d,c,t),0.72),pu=P(u[0],u[1],u[2]),pv=P(v[0],v[1],v[2]);
    ctx.lineWidth=(k%3===0)?1.6:0.9;ctx.beginPath();ctx.moveTo(pu[0],pu[1]);ctx.lineTo(pv[0],pv[1]);ctx.stroke();}}
// 원통 옆면 스티커: axis 'y' 는 θ(앞 오른쪽 위), 'z' 는 xy 평면 θ 방향
function stickCyl(cx,cy,cz,r,axis,t1,t2,s1,s2){var c1=Math.cos(t1),n1=Math.sin(t1),c2=Math.cos(t2),n2=Math.sin(t2),r2=r+0.005;
  if(axis==='y')stick([cx+r2*c1,cy+s1,cz+r2*n1],[cx+r2*c1,cy+s2,cz+r2*n1],[cx+r2*c2,cy+s2,cz+r2*n2],[cx+r2*c2,cy+s1,cz+r2*n2]);
  else stick([cx+r2*c1,cy+r2*n1,cz+s2],[cx+r2*c2,cy+r2*n2,cz+s2],[cx+r2*c2,cy+r2*n2,cz+s1],[cx+r2*c1,cy+r2*n1,cz+s1]);}
function IB(x,y,z,w,d,h,c){return {bb:[x,x+w,y,y+d,z,z+h],draw:function(){drawBox(x,y,z,w,d,h,c);}};}
function IF(bb,fn){return {bb:bb,draw:fn};}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function icon(x,y,ok){if(ok===2){ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fillStyle='#6b5a12';ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 13px Malgun Gothic';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',x,y+1);return;}
  ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fillStyle=ok?'#1f6b3a':'#8a1f1f';ctx.fill();ctx.strokeStyle=ok?'#7fe0a0':'#ff8a8a';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.beginPath();if(ok){ctx.moveTo(x-5,y);ctx.lineTo(x-1,y+4);ctx.lineTo(x+5,y-4);}else{ctx.moveTo(x-4,y-4);ctx.lineTo(x+4,y+4);ctx.moveTo(x+4,y-4);ctx.lineTo(x-4,y+4);}ctx.stroke();}
function env(x,y,c,sc){sc=sc||1;var w=14*sc,h=10*sc;ctx.fillStyle=c;ctx.fillRect(x-w/2,y-h/2,w,h);ctx.strokeStyle='#1b1d20';ctx.lineWidth=1;ctx.strokeRect(x-w/2,y-h/2,w,h);
  ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x,y+1);ctx.lineTo(x+w/2,y-h/2);ctx.stroke();}

// ── 깊이 정렬 ──
function cmp(a,b){var e=1e-3;
  if(a[1]<=b[0]+e)return -1;if(b[1]<=a[0]+e)return 1;
  if(a[3]<=b[2]+e)return -1;if(b[3]<=a[2]+e)return 1;
  if(a[5]<=b[4]+e)return -1;if(b[5]<=a[4]+e)return 1;
  return (a[0]+a[2]+a[4])-(b[0]+b[2]+b[4]);}
function sortItems(items){
  items.forEach(function(it){var b=it.bb,mx=1e9,Mx=-1e9,my=1e9,My=-1e9;
    for(var a=0;a<8;a++){var q=P(b[a&1],b[2+((a>>1)&1)],b[4+((a>>2)&1)]);if(q[0]<mx)mx=q[0];if(q[0]>Mx)Mx=q[0];if(q[1]<my)my=q[1];if(q[1]>My)My=q[1];}
    it.sb=[mx,Mx,my,My];it.dep=[];it.v=0;});
  for(var i=0;i<items.length;i++)for(var j=i+1;j<items.length;j++){var A=items[i],B=items[j];
    if(A.sb[1]<=B.sb[0]||B.sb[1]<=A.sb[0]||A.sb[3]<=B.sb[2]||B.sb[3]<=A.sb[2])continue;
    var r=cmp(A.bb,B.bb);if(r<0)B.dep.push(A);else if(r>0)A.dep.push(B);}
  var out=[];function visit(it){if(it.v)return;it.v=1;it.dep.forEach(visit);it.v=2;out.push(it);}
  items.forEach(visit);return out;}

// ── 배치 ──
var ZONES=[

  {r:[13.8,5.3,3.7,1.8],f:'rgba(190,60,60,0.25)',b:'#b44',n:'S500 Holding'},

var CODE={CT_SIDE:'S300',TRUCK_IN:'물류 트럭',DOCK_IN:'S050',S100:'S100',S250:'S250',RW:'PP_RW',RW_OUT:'PP_RW',S300:'S300',CT:'PP_CT',PACKWAIT:'PP_CT',PACKOUT:'PP_CT',S400:'S400',S920:'S920',TRUCK_OUT:'출하',S500:'S500',S540:'S540'};

var ST,simT=0,hoverLot=null,selLot=null,tagRects=[];
function reset(){ST={dlv:null,so:null,wo:null,truckIn:null,lots:{},order:0,queue:[],sap:{rx:0,tx:0},now:0,board:'',run:null,clk:null,fx:[],lines:[],touched:{},fail:null,step:0};}
function L(id){return ST.lots[id];}
function live(){return Object.keys(ST.lots).map(L).filter(function(l){return l.st!=='END';});}
function atLoc(loc){return live().filter(function(l){return l.loc===loc;}).sort(function(a,b){return a.ord-b.ord;});}
function slotPos(l){var arr=atLoc(l.loc),i=arr.indexOf(l),sl=SL[l.loc]||[[0,0,0]],b=sl[Math.min(i,sl.length-1)],ex=Math.max(0,i-sl.length+1)*0.35,tx=l.loc==='TRUCK_IN'?(truckOff()||0):0;return {x:b[0]+ex+tx,y:b[1]+ex,z:b[2]};}
function posOf(l){var a=l.anim;if(a){var f=(simT-a.t0)/a.dur;if(f>=1){l.anim=null;}else{f=f<0?0:f;f=f*f*(3-2*f);return along(a.path,a.len*f);}}return slotPos(l);}
function along(p,d){for(var i=0;i<p.length-1;i++){var a=p[i],b=p[i+1],sg=Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z);if(d<=sg||i===p.length-2){var t=sg?Math.min(1,d/sg):1;return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t};}d-=sg;}return p[p.length-1];}
function plen(p){var n=0;for(var i=0;i<p.length-1;i++)n+=Math.hypot(p[i+1].x-p[i].x,p[i+1].y-p[i].y,p[i+1].z-p[i].z);return n;}
function route(a,b,fl,tl){if(Math.hypot(a.x-b.x,a.y-b.y)<3.2)return [a,b];
  var a1=BACK[fl]?4.6:8.6,a2=BACK[tl]?4.6:8.6,pts=[a,{x:a.x,y:a1,z:a.z*0.5}];
  if(a1!==a2){var cx=(a.x+b.x)/2>10?21.2:0.4;pts.push({x:cx,y:a1,z:0},{x:cx,y:a2,z:0});}
  pts.push({x:b.x,y:a2,z:b.z*0.5},b);return pts;}

function negPill(c){var n=NEG[c];if(!n)return '';var cl=n[0]==='협의됨'?'p-ok':n[0]==='가정 적용'?'p-as':n[0]==='확인 필요'?'p-ck':'p-ng';return '<span class="pill '+cl+'" title="'+esc(n[1])+'">'+c+' '+n[0]+'</span>';}
function qPill(q){var n=INQ[q];if(!n)return '';return '<span class="pill '+(n[1]?'p-ok':'p-ng')+'" title="'+esc(n[0])+'">'+q+' '+(n[1]?'회신':'미회신')+'</span>';}
function invMap(){var m={};live().forEach(function(l){var c=CODE[l.loc];if(!m[c])m[c]={n:0,u:{}};m[c].n++;m[c].u[l.unit]=(m[c].u[l.unit]||0)+l.qty;});return m;}
function invTxt(e){return e?e.n+' LOT · '+Object.keys(e.u).map(function(u){return e.u[u]+' '+u;}).join(' + '):'';}
var INV0={},TBLOPEN=false;
function rows(sec){return ST.lines.filter(function(l){return l.sec===sec;}).map(function(l){
  return '<div class="row'+(l.lot&&l.lot===hoverLot?' hl':'')+'"'+(l.lot?' data-lot="'+l.lot+'"':'')+'><i>'+l.ic+'</i><span>'+esc(l.t)+'</span></div>';}).join('');}
function ui(){var st=STEPS[cur],done=opi>=st.ops.length,f=ST.fail;
  document.getElementById('phs').innerHTML=PH.map(function(p,i){return '<span class="'+(i<st.ph?'done':i===st.ph?'on':'')+'">'+p+'</span>';}).join('');
  var h='<div class="sec"><div class="ctl"><select id="sCase">'+CASES.map(function(c,i){return '<option value="'+i+'"'+(c===CASE?' selected':'')+'>'+c.nm+'</option>';}).join('')+'</select></div>'+
    '<div class="ctl"><button id="bFirst" title="처음부터 (1단계)">⏮ 처음부터</button><button id="bPrev">◀</button><button id="bPlay">'+(playing?'⏸':'⏵')+'</button><button id="bNext">▶</button><button id="bSpd">'+speed+'x</button><span class="n">'+(cur+1)+' / '+STEPS.length+'</span></div>'+
    '<div class="ttl">'+(cur+1)+'. '+esc(st.t)+'</div><div class="who">'+esc(st.who)+'</div>'+
    (ST.wo?'<div style="margin-top:4px">📋 '+ST.wo.id+' · '+['RW','CT'].map(function(k){var o=ST.wo[k],w=woState(k);return o.eq+' '+o.done+'/'+o.plan+' '+o.unit+' <span style="color:'+w[1]+'">'+w[0]+'</span>';}).join(' · ')+'</div>':'')+
    (ST.dlv?'<div>📥 '+ST.dlv.id+' · '+ST.dlv.item+' '+ST.dlv.plan+' '+ST.dlv.unit+' <span style="color:'+dlvState()[1]+'">'+dlvState()[0]+'</span></div>':'')+
    (ST.so?'<div>🚚 '+ST.so.id+' · 피킹 '+ST.so.pick+'/'+ST.so.plan+' EA <span style="color:'+soState()[1]+'">'+soState()[0]+'</span></div>':'')+'</div>';
  // ② 결과
  if(f)h+='<div class="sec res ng'+(f.info?' info':'')+'"><h4>② 결과</h4><div class="big">'+(f.info?'⚠ ':'⛔ ')+f.code+' · '+esc(f.msg)+'</div><div>규칙: '+esc(f.rule)+'</div>'+
    '<div>이 규칙의 협의 상태: '+f.negs.map(negPill).join('')+' '+f.qs.map(qPill).join('')+'</div><div class="mut">'+(f.info?'처리는 되지만 실적은 늘지 않음':'LOT · 재고 · I/F 변화 없음 (롤백)')+'</div></div>';
  else h+='<div class="sec res'+(done?'':' run')+'"><h4>② 결과</h4><div class="big'+(done?' ok':'')+'">'+(done?'✓ 성공':'진행 중…')+'</div>'+rows('res')+'</div>';
  // ③ LOT 변화 (+ 선택 LOT 카드)
  var card='';if(selLot&&L(selLot)){var l=L(selLot);card='<div class="card"><b>'+l.id+'</b> · '+KIND[l.kind]+'<br>품번 '+prodOf(l)+' · '+l.qty+' '+l.unit+' · '+CODE[l.loc]+' · <span style="color:'+stColor(l)+'">'+stLabel(l)+'</span>'+
    '<div class="mut">'+l.hist.slice(-6).map(esc).join('<br>')+'</div></div>';}
  var lr=rows('lot');h+='<div class="sec"><h4>③ LOT 변화</h4>'+card+(lr||'<div class="mut">'+(f?'변화 없음':'없음')+'</div>')+'</div>';
  // ④ 창고 재고
  var inv=invMap();h+='<div class="sec"><h4>④ 창고 재고</h4><table class="inv">'+INVROWS.map(function(r){var a=invTxt(inv[r[0]]),b=invTxt(INV0[r[0]]);
    return '<tr class="'+(a!==b?'ch':a?'':'z')+'"><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+(a||'—')+'</td></tr>';}).join('')+'</table></div>';
  // ⑤ I/F
  var ir=rows('if');h+='<div class="sec"><h4>⑤ I/F (가상)</h4>'+(ir||'<div class="mut">이번 단계 I/F 없음</div>')+
    '<div style="margin-top:4px"><span class="q" style="background:#4ea1ff"></span>SAP 누적 · 수신 '+ST.sap.rx+' · 송신 '+ST.sap.tx+'</div></div>';
  // ⑥ 협의 포인트
  var ng=(NEGACT[st.a]||[]),qs=(ACTQ[st.a]||[]);h+='<div class="sec"><h4>⑥ 협의 포인트</h4>'+ng.map(function(c){return '<div>'+negPill(c)+' '+esc(NEG[c]?NEG[c][1]:'')+'</div>';}).join('')+
    (qs.length?'<div style="margin-top:4px">'+qs.map(function(q){return '<div>'+qPill(q)+' '+esc(INQ[q][0])+(INQ[q][1]?' → '+esc(INQ[q][1]):'')+'</div>';}).join('')+'</div>':'')+'</div>';
  // ▸ 테이블 변경 (기본 접힘)
  var tl=ST.lines.filter(function(l){return l.sec==='tbl';});
  h+='<div class="sec"><details id="dTbl"'+(TBLOPEN?' open':'')+'><summary>▸ 테이블 변경 ('+tl.length+') · 내부 확인용</summary>'+tl.map(function(l){return '<div class="mut">'+esc(l.t)+'</div>';}).join('')+'</details></div>';
  side.innerHTML=h;
  document.getElementById('bFirst').onclick=function(){goTo(0);};
  document.getElementById('bPrev').onclick=function(){goTo(cur-1);};document.getElementById('bNext').onclick=function(){goTo(cur+1);};
  document.getElementById('bPlay').onclick=function(){playing=!playing;ui();};
  document.getElementById('bSpd').onclick=function(){speed=speed===1?2:speed===2?0.5:1;ui();};
  document.getElementById('sCase').onchange=function(){CASE=CASES[+this.value];STEPS=CASE.steps;selLot=null;goTo(CASE.start);};
  document.getElementById('dTbl').ontoggle=function(){TBLOPEN=this.open;};}
side.onmouseover=function(e){var r=e.target.closest&&e.target.closest('[data-lot]');var v=r?r.getAttribute('data-lot'):null;if(v!==hoverLot){hoverLot=v;}};
side.onclick=function(e){var r=e.target.closest&&e.target.closest('[data-lot]');if(r){selLot=r.getAttribute('data-lot');ui();}};
function hit(e){var b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;for(var i=tagRects.length-1;i>=0;i--){var t=tagRects[i];if(x>=t[0]&&x<=t[0]+t[2]&&y>=t[1]&&y<=t[1]+t[3])return t[4];}return null;}
cv.onmousemove=function(e){var id=hit(e);cv.style.cursor=id?'pointer':'default';if(id!==hoverLot){hoverLot=id;ui();}};
cv.onclick=function(e){selLot=hit(e);ui();};

// ── 진행 ──
var cur=0,opi=0,nextAt=0,doneAt=null,playing=false,speed=1,last=performance.now();
function goTo(n){n=Math.max(0,Math.min(STEPS.length-1,n));reset();
  for(var i=0;i<n;i++){ST.step=i;ST.now+=STEPS[i].tick||0;STEPS[i].ops.forEach(function(op){OPS[op[0]](op,false);});}
  live().forEach(function(l){l.anim=null;});
  ST.fx=[];ST.lines=[];ST.touched={};ST.run=null;ST.fail=null;ST.step=n;ST.now+=STEPS[n].tick||0;INV0=invMap();cur=n;opi=0;nextAt=simT+400;doneAt=null;ui();}
function tick(now){var dt=Math.min(100,now-last);last=now;simT+=dt*speed;var st=STEPS[cur];
  if(opi<st.ops.length&&simT>=nextAt){var op=st.ops[opi++];nextAt=simT+OPS[op[0]](op,true);ui();}
  else if(opi>=st.ops.length&&doneAt===null&&simT>=nextAt){doneAt=simT;ui();}
  if(playing&&doneAt!==null&&simT-doneAt>(ST.fail?3500:2000)&&cur<STEPS.length-1)goTo(cur+1);
  frame();requestAnimationFrame(tick);}
window.addEventListener('resize',fit);
fit();buildStatic();goTo(CASE.start);requestAnimationFrame(tick);
})();
</script>

</body></html>
